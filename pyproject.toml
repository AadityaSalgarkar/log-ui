[project]
name = "log-ui"
version = "0.1.0"
description = "Self-hosted, wandb-style dashboard for trackio experiment stores"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["experiment-tracking", "trackio", "wandb", "dashboard", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
]

[project.scripts]
log-ui = "log_ui.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "trackio>=0.38"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["log_ui"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/dist", "web/.vitest", "to-delete", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
