[project]
name = "log-ui"
dynamic = ["version"]  # from log_ui/__init__.py
description = "Self-hosted, wandb-style dashboard for trackio experiment stores"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["experiment-tracking", "trackio", "wandb", "dashboard", "deep-learning"]
authors = [{ name = "Aaditya Salgarkar" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
]

[project.scripts]
log-ui = "log_ui.cli:main"

[project.urls]
Homepage = "https://aadityasalgarkar.github.io/log-ui/"
Repository = "https://github.com/AadityaSalgarkar/log-ui"
Issues = "https://github.com/AadityaSalgarkar/log-ui/issues"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "trackio>=0.38"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "log_ui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["log_ui"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/dist", "web/.vitest", "to-delete", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
