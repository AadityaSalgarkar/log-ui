name: Release

# Push a tag `vX.Y.Z` matching log_ui.__version__ to release:
#   - builds the wheel and sdist and attaches them to a GitHub Release whose notes come from CHANGELOG.md
#   - publishes to PyPI with trusted publishing, once enabled (repository variable PUBLISH_PYPI = "true")
# The Docker image for the tag (ghcr.io/aadityasalgarkar/log-ui:X.Y.Z) is published by docker-publish.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: version
        name: Tag matches log_ui.__version__
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' log_ui/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match log_ui.__version__ $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: uv build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            notes.md

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "log-ui ${{ needs.build.outputs.version }}" --notes-file notes.md

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/log-ui/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
